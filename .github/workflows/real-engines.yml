name: Real TeX engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'test/dune'
      - 'test/corpus/**'
      - 'test/integration/check_real_engines.py'
      - 'test/integration/check_tectonic.py'
      - '.github/workflows/real-engines.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'test/dune'
      - 'test/corpus/**'
      - 'test/integration/check_real_engines.py'
      - 'test/integration/check_tectonic.py'
      - '.github/workflows/real-engines.yml'

permissions:
  contents: read

env:
  # Same pinned compiler as the package workflow.
  OCAML_COMPILER: '5.4.1'

concurrency:
  group: real-engines-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  texlive:
    name: ${{ matrix.engine }} / BibTeX / Biber
    strategy:
      fail-fast: false
      matrix:
        engine: [pdflatex, xelatex, lualatex]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true
      - name: Install OCaml dependencies
        run: |
          opam install . --deps-only --with-test
          opam var bin >> "$GITHUB_PATH"
      - name: Install real rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipx latexmk texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-pictures texlive-xetex texlive-luatex lmodern preview-latex-style biber poppler-utils
          pipx install uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and run real-engine corpus
        run: |
          dune build
          uv run test/integration/check_real_engines.py --engine "${{ matrix.engine }}"
      - name: Upload rendering evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-engines-${{ matrix.engine }}
          path: dist/real-engines/
          if-no-files-found: warn
          retention-days: 14

  tectonic:
    name: Tectonic / BibTeX / Biber / cached resources
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true
      - name: Install OCaml dependencies
        run: |
          opam install . --deps-only --with-test
          opam var bin >> "$GITHUB_PATH"
      - name: Install pinned Tectonic and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipx poppler-utils
          pipx install uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/tectonic.tar.gz" https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$HOME/.local/bin" tectonic
      - name: Provision bundle-compatible Biber for this job only
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/biber-2.17.tar.gz" https://downloads.sourceforge.net/project/biblatex-biber/biblatex-biber/2.17/binaries/Linux/biber-linux_x86_64.tar.gz
          echo "129d2e0332a57e985ffa253e5e9fbd28ef99af5a068d1b141145211969aa8999  $RUNNER_TEMP/biber-2.17.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/biber-2.17"
          tar -xzf "$RUNNER_TEMP/biber-2.17.tar.gz" -C "$RUNNER_TEMP/biber-2.17" biber
          "$RUNNER_TEMP/biber-2.17/biber" --version
      - name: Build and test online then cached rendering
        run: |
          dune build
          uv run test/integration/check_tectonic.py --bundle https://data1.fullyjustified.net/tlextras-2022.0r0.tar --biber "$RUNNER_TEMP/biber-2.17/biber"
      - name: Upload rendering evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-engines-tectonic
          path: dist/real-engines/
          if-no-files-found: warn
          retention-days: 14
