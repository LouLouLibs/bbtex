name: Real TeX engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'test/corpus/**'
      - 'test/integration/check_real_engines.py'
      - '.github/workflows/real-engines.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'test/corpus/**'
      - 'test/integration/check_real_engines.py'
      - '.github/workflows/real-engines.yml'

permissions:
  contents: read

concurrency:
  group: real-engines-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  pdflatex:
    name: pdfLaTeX / BibTeX / Biber
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-dune pipx latexmk texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended texlive-pictures preview-latex-style biber poppler-utils
          pipx install uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and run real-engine corpus
        run: |
          dune build
          uv run test/integration/check_real_engines.py
      - name: Upload rendering evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-engines-pdflatex
          path: dist/real-engines/
          if-no-files-found: warn
          retention-days: 14
