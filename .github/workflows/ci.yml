name: Build and package

# Manual only: day-to-day checks run on an Apple Silicon Mac with scripts/ci.sh,
# which posts the "local-ci/macos-arm64" commit status. Actions minutes are
# limited on this private repository.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # One pinned compiler for every job; opam builds it once per runner, then caches it.
  OCAML_COMPILER: '5.4.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint bash scripts (shellcheck is preinstalled on Ubuntu runners)
        run: |
          shellcheck --version | head -2
          shellcheck -s bash scripts/*.sh test/integration/*.sh

  package:
    name: macOS / ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.13'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true
      - name: Install OCaml dependencies
        run: |
          opam install . --deps-only --with-test
          # Later steps and scripts call dune and ocamlc directly.
          opam var bin >> "$GITHUB_PATH"
      - name: Install uv and BBEdit scripting dictionary
        run: |
          brew install uv
          brew install --cask bbedit
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/BBEdit.app
          uv python install 3.13
      - name: Build and test
        run: |
          dune build
          dune runtest
          uv run test/integration/check_project_builds.py
          uv run test/integration/check_preview_cancellation.py
          node test/integration/check_snippet_page.mjs
          uv run test/integration/check_draft_release.py
          for script in scripts/*.sh test/integration/*.sh; do bash -n "$script"; done
          perl -c scripts/with-preview-lock.pl
          git diff --check
      - name: Build and verify package
        run: |
          bash test/integration/check_preview_release.sh
          file _build/default/bin/main.exe | grep -F "$ARCH"
          # Packages must not require the CI runner's Homebrew libraries.
          otool -L _build/default/bin/main.exe | tail -n +2 | awk '{print $1}' > dist/linked-libraries.txt
          if grep -Ev '^(/usr/lib/|/System/Library/)' dist/linked-libraries.txt; then
            echo 'Unexpected non-system dynamic library dependency' >&2
            exit 1
          fi
          mkdir -p dist/release
          cp dist/bbtex.bbpackage.zip "dist/release/bbtex-macos-$ARCH.bbpackage.zip"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Architecture: $ARCH"
            sw_vers
            ocamlc -version
            dune --version
            uv --version
          } > "dist/release/build-info-$ARCH.txt"
          cd dist/release
          shasum -a 256 "bbtex-macos-$ARCH.bbpackage.zip" > "SHA256SUMS-$ARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbtex-macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
