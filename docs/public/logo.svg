<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="bbtex: BBTeX set like the LaTeX logo, in an editor window">
  <!-- An editor window: rounded frame, title bar with three dots. -->
  <rect x="2" y="3" width="60" height="58" rx="9" fill="#fffffc" stroke="#1f2328" stroke-width="2.5"/>
  <path d="M2 16 H62" stroke="#1f2328" stroke-width="2"/>
  <circle cx="10" cy="9.6" r="2.2" fill="#ef4444"/>
  <circle cx="17" cy="9.6" r="2.2" fill="#eab308"/>
  <circle cx="24" cy="9.6" r="2.2" fill="#22c55e"/>
  <!-- "BBTeX" typeset like "LaTeX": a small raised B, a lowered E. -->
  <g font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Times, serif" fill="#111">
    <text x="5" y="46" font-size="20">B</text>
    <text x="16.6" y="37.5" font-size="13">B</text>
    <text x="26.3" y="46" font-size="18">T</text>
    <text x="34.6" y="50.3" font-size="18">E</text>
    <text x="43.6" y="46" font-size="18">X</text>
  </g>
  <!-- Text cursor. -->
  <rect x="57.6" y="31" width="1.6" height="18" fill="#22c55e"/>
</svg>
